name: Release

# After a merge to main: push the image tagged with the commit sha, then publish
# the next patch release (vX.Y.Z+1, or v0.1.0 for the first) on that commit.
# Production's Application (kubernetes/deploy/production.jsonnet) follows the
# highest release tag and passes its commit sha to main.jsonnet as imageTag, so
# publishing the release is the deploy.
#
# Nothing here writes to main, so main's rules don't apply and GITHUB_TOKEN is
# enough. To bump minor or major, publish a release by hand (vX.Y+1.0); later
# runs bump the patch from there.
#
# The release is published after the push only to keep the window short.
# Kubernetes doesn't need it: if ArgoCD rolls out a sha before its image exists,
# Knative keeps serving the previous revision and retries until the image lands.
on:
  push:
    branches:
      - main
  # dependabot-automerge.yaml dispatches this, since its merges raise no push.
  workflow_dispatch:

# Runs one at a time, so versions are allocated in merge order. A newer pending
# run replaces an older pending one; its release includes the older commits.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    # A dispatch can name any branch. Only main is released, and never on the
    # template itself, which has no Frontier deployment.
    if: github.ref == 'refs/heads/main' && github.repository != 'persona-id/persona-template-frontier-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Application only passes the tag. The image repository comes from the
      # name in kubernetes/jsonnet/common/app.libsonnet, so an image pushed
      # anywhere else would deploy as an image that doesn't exist.
      - name: Check the app name matches the repository
        run: |
          if ! grep -qF "name: '${GITHUB_REPOSITORY#*/}'," kubernetes/jsonnet/common/app.libsonnet; then
            echo "::error::name in kubernetes/jsonnet/common/app.libsonnet is not ${GITHUB_REPOSITORY#*/}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # The OCI source and revision labels (see the Dockerfile).
          build-args: |
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    # Records a GitHub deployment to production on this job, since publishing
    # the release is what deploys. deploy-dev.yaml does the same for dev.
    environment:
      name: production
      url: https://app-frontier-${{ github.event.repository.name }}-prod.private.frontier.withpersona.app
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All tags, to find the latest version.
          fetch-depth: 0

      - name: Publish the next patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only plain vX.Y.Z counts. Prereleases are never deployed, so they
          # don't move the version either.
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            # A dispatch re-runs for a commit that already has its release, for
            # example when the Dependabot reconcile retries.
            if [ "$(git rev-parse "$latest^{commit}")" = "$GITHUB_SHA" ]; then
              echo "$GITHUB_SHA is already $latest."
              exit 0
            fi
            # Never publish an older commit above a newer one: the highest
            # version is what production runs.
            if ! git merge-base --is-ancestor "$latest" "$GITHUB_SHA"; then
              echo "::warning::$GITHUB_SHA does not contain $latest. Not releasing it."
              exit 0
            fi
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi

          # Creates a lightweight tag on the commit, which is what ArgoCD needs
          # to resolve the release to this sha.
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
          echo "Released $GITHUB_SHA as $next."
